name: Docker (GHCR)

# Publica as imagens da API e do front no GitHub Container Registry quando uma tag de versão
# (v1.2.3) é criada. Em Pull Request só valida o build (sem publicar).
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'apps/**/Dockerfile'
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - '.dockerignore'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/backend/Dockerfile
          - name: web
            dockerfile: apps/frontend/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados e tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 vira 1.2.3 (tag fixa, sem :latest).
          tags: type=semver,pattern={{version}}
          flavor: latest=false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build e publicação (só publica em tag)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || format('{0}:pr-test', env.IMAGE) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
